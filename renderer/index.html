<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEN</title>
<link rel="stylesheet" href="app.css">
<style>.ui-icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}</style>
</head>
<body>
<aside class="side">
  <div class="brand"><img class="logo-img" src="ven-logo.png" alt="VEN"><b>VEN</b></div>
  <nav id="nav"></nav>
  <div class="side-foot"><div id="arquivoInfo" class="mut small">Nenhum backup aberto</div></div>
</aside>
<main class="main">
  <header class="top">
    <h1 id="titulo">Início</h1>
    <div class="top-tools">
      <input id="busca" type="search" placeholder="Buscar (Ctrl+K)" aria-label="Buscar">
      <button class="btn" id="btnAbrir"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H10l2 2h5.5A2.5 2.5 0 0 1 20 9.5v7a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><path d="M4 10h16"/></svg>Abrir backup</button>
      <button class="btn" id="btnSalvar"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12l3 3v13H4V4z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg>Salvar cópia</button>
      <button class="btn" id="btnDriveConectar"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 17.5H6a4 4 0 0 1-.3-8A6.5 6.5 0 0 1 18 8a4.8 4.8 0 0 1 0 9.5h-2"/><path d="M12 12v9m-3-3 3 3 3-3"/></svg>Conectar Google</button>
      <button class="btn pri" id="btnDriveSync"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.2 9A6.5 6.5 0 0 1 17 6.5L20 12M4 12l3 5.5A6.5 6.5 0 0 0 18 15"/></svg>Sincronizar com Android</button>
    </div>
  </header>
  <section id="conteudo" class="conteudo"></section>
</main>
<div id="toast" class="toast" hidden></div>
<div id="googleCredModal" class="modal-bg" hidden role="dialog" aria-modal="true" aria-labelledby="googleCredTitle">
  <div class="modal" style="padding:22px;gap:14px">
    <h2 id="googleCredTitle" style="margin:0">Conectar ao Google Drive</h2>
    <p class="mut" style="margin:0">Cole a chave secreta do cliente OAuth criada no Google Cloud. Ela será guardada criptografada neste computador.</p>
    <label for="googleClientSecret">Chave secreta do cliente</label>
    <input id="googleClientSecret" type="password" autocomplete="off" placeholder="Cole a chave secreta aqui">
    <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" id="googleCredCancel">Cancelar</button><button class="btn pri" id="googleCredContinue">Continuar</button></div>
  </div>
</div>
<div id="imp" class="imp"></div>
<script src="util.js"></script>
<script src="acoes.js"></script>
<script src="app.js"></script>
</body>
</html>
