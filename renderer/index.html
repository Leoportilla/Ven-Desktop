<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; font-src 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEN</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
<aside class="side">
  <div class="marca"><img src="ven-logo.png" alt=""><div><b>VEN</b><small>Vendas e finanças</small></div></div>
  <nav id="nav" aria-label="Principal"></nav>
  <div class="side-foot"><div id="arquivoInfo" class="arquivo"></div></div>
</aside>
<main class="main">
  <header class="top">
    <div class="top-tit"><h1 id="titulo">Início</h1><small id="subtitulo"></small></div>
    <div class="top-tools">
      <label class="busca"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg><input id="busca" type="search" placeholder="Filtrar a lista  ( / )" aria-label="Filtrar lista"></label>
      <button class="btn" id="btnSync" title="Sincronizar com o celular"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.2 9A6.5 6.5 0 0 1 17 6.5L20 12M4 12l3 5.5A6.5 6.5 0 0 0 18 15"/></svg><span id="btnSyncTxt">Sincronizar</span></button>
      <button class="btn" id="btnPaleta" title="Busca rápida (Ctrl+K)"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg>Ctrl+K</button>
      <button class="btn" id="btnAtualizar" title="Verificar se há uma nova versão"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m0 0L7 8m5-5 5 5"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>Atualizações</button>
      <button class="btn" id="btnAbrirTopo"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H10l2 2h5.5A2.5 2.5 0 0 1 20 9.5v7a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/></svg>Abrir backup</button>
    </div>
  </header>
  <section id="conteudo" class="conteudo"></section>
</main>
</div>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
<div id="googleCredModal" class="modal-bg" hidden role="dialog" aria-modal="true" aria-labelledby="googleCredTitle">
  <div class="modal sm"><header class="m-head"><div class="m-tit"><h2 id="googleCredTitle">Conectar ao Google Drive</h2><p>Cole a chave secreta do cliente OAuth criada no Google Cloud. Ela fica guardada criptografada neste computador.</p></div></header>
  <div class="m-body"><label class="f"><span>Chave secreta do cliente</span><input id="googleClientSecret" type="password" autocomplete="off" placeholder="Cole a chave aqui"></label></div>
  <footer class="m-foot"><div class="m-acoes"><button class="btn" id="googleCredCancel">Cancelar</button><button class="btn pri" id="googleCredContinue">Continuar</button></div></footer></div>
</div>
<script src="icons.js"></script>
<script src="util.js"></script>
<script src="sync.js"></script>
<script src="boleto.js"></script>
<script src="impressao.js"></script>
<script src="importar.js"></script>
<script src="acoes_cad.js"></script>
<script src="acoes_fin.js"></script>
<script src="acoes_venda.js"></script>
<script src="telas.js"></script>
<script src="app.js"></script>
</body>
</html>
