name: Gerar VEN Desktop (pasta portátil)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - name: Compactar pasta portátil
        shell: pwsh
        run: Compress-Archive -Path dist\win-unpacked\* -DestinationPath VEN-Desktop-pasta-portatil.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VEN-Desktop-pasta-portatil
          path: VEN-Desktop-pasta-portatil.zip
